<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE NUMB4US</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 15px;
        }

        .photo {
            width: min(90vw, 430px);
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.25);
        }

        .title {
            width: 80vw;
            margin-top: 25px;
            color: #ff2020;
            font-size: 8vw;
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.05;
            text-shadow: 0 0 15px #ff0000;
        }

        .instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 65px;
            height: 65px;
            margin-top: 30px;
            border: 2px solid #ff2020;
            border-radius: 50%;
            color: #ff2020;
            text-decoration: none;
            font-size: 38px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
        }

        .name {
            margin-top: 15px;
            color: #ff2020;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .tagline {
            margin-top: 9px;
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 4px;
        }
    </style>
</head>

<body>

    <main class="page">

        <img
            class="photo"
            src="ashu acrss.jpg"
            alt="THE NUMB4US"
        >

        <h1 class="title">I M BACK AGAIN</h1>

        <a
            class="instagram"
            href="https://www.instagram.com/the_numb4us/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="THE NUMB4US Instagram"
        >
            ◎
        </a>

        <div class="name">
            THE NUMB4US
        </div>

        <div class="tagline">
            EGOISTIC MANIPULATIVE
        </div>

    </main>

</body>
</html>
